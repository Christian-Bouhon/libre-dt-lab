name: Linux portable packages

# Builds self-contained .deb and .rpm packages (application + all libraries)
# that install under /opt/libre-dt-lab with a launcher and a menu entry.
# They depend only on the system C library, so the same package works across
# distributions (built on Ubuntu 22.04 = glibc 2.35 for wide compatibility).

on:
  workflow_dispatch:
  push:
    tags:
      - 'libre-*'

permissions:
  contents: write

jobs:
  portable:
    name: Portable deb + rpm
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install GCC 12
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc-12 g++-12

      - name: Install base dependencies
        run: |
          sudo apt-get -y install \
            build-essential desktop-file-utils gettext git gdb intltool \
            libarchive-dev libatk1.0-dev libcairo2-dev libcolord-dev \
            libcolord-gtk-dev libcups2-dev libcurl4-gnutls-dev \
            libimage-exiftool-perl libfuse2 libgdk-pixbuf2.0-dev \
            libglib2.0-dev libgmic-dev libgraphicsmagick1-dev libgtk-3-dev \
            libinih-dev libjson-glib-dev liblcms2-dev liblensfun-dev \
            liblensfun-bin liblensfun-data-v1 liblensfun1 libosmgpsmap-1.0-dev \
            libpango1.0-dev libpng-dev libportmidi-dev libpotrace-dev \
            libpugixml-dev librsvg2-dev libsaxon-java libsdl2-dev \
            libsecret-1-dev libsqlite3-dev libtiff5-dev libwebp-dev \
            libx11-dev libxml2-dev libxml2-utils ninja-build perl po4a \
            python3-jsonschema xsltproc zlib1g-dev appstream rpm

      - name: Add PPA for newer multimedia libraries
        run: |
          sudo add-apt-repository -y ppa:savoury1/graphics
          sudo add-apt-repository -y ppa:savoury1/ffmpeg4
          sudo add-apt-repository -y ppa:savoury1/display
          sudo apt-get update

      - name: Install extra dependencies
        run: |
          sudo apt-get -y install \
            aom-tools libaom-dev libavif-dev libgphoto2-dev libde265-dev \
            libimath-dev libjpeg-turbo8-dev libjxl-dev libopenexr-dev \
            libopenh264-dev libopenjp2-7-dev libsharpyuv-dev libx265-dev \
            libwebm-dev x11proto-dev libxfixes-dev

      - name: Build and install libheif with built-in decoders
        run: |
          git clone --branch v1.23.0 --depth 1 https://github.com/strukturag/libheif src-libheif
          cd src-libheif
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PLUGIN_LOADING=OFF \
            -DWITH_LIBDE265=ON \
            -DWITH_AOM_DECODER=ON \
            -DWITH_AOM_ENCODER=ON \
            -DWITH_OpenH264_DECODER=ON \
            -DWITH_JPEG_DECODER=ON \
            -DWITH_OpenJPEG_DECODER=ON \
            -DWITH_LIBSHARPYUV=ON \
            -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C build
          sudo ninja -C build install
          cd ..

      - name: Build and install a newer exiv2
        run: |
          git clone --branch v0.28.8 --depth 1 https://github.com/Exiv2/exiv2 src-exiv2
          cd src-exiv2
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DEXIV2_ENABLE_NLS=ON \
            -DEXIV2_ENABLE_VIDEO=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          sudo cmake --install build
          cd ..

      - name: Update lensfun data
        run: sudo lensfun-update-data

      - name: Build portable packages
        env:
          CC: gcc-12
          CXX: g++-12
        run: bash tools/portable-package-build-script.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: artifact-portable-linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach packages to release
    needs: portable
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
