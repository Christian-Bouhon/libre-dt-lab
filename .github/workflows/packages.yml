name: Linux packages

on:
  push:
    tags:
      - 'libre-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: deb (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --tmpfs /tmp:exec
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:24.04', label: 'ubuntu-24.04' }
          - { image: 'debian:13',    label: 'debian-13' }
    steps:
      # a container job needs git present before actions/checkout can run
      - name: Bootstrap git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get -y install --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -y install --no-install-recommends \
            build-essential cmake ninja-build intltool po4a xsltproc \
            gettext desktop-file-utils python3-jsonschema lsb-release \
            libarchive-dev libatk1.0-dev libavif-dev libcairo2-dev \
            libcolord-dev libcolord-gtk-dev libcups2-dev libcurl4-gnutls-dev \
            libexiv2-dev libgdk-pixbuf-2.0-dev libglib2.0-dev libgmic-dev \
            libgphoto2-dev libgraphicsmagick1-dev libgtk-3-dev libheif-dev \
            libicu-dev libimath-dev libjpeg-dev libjson-glib-dev libjxl-dev \
            liblcms2-dev liblensfun-dev liblua5.4-dev libncurses-dev \
            libopenexr-dev libopenjp2-7-dev libosmgpsmap-1.0-dev \
            libpango1.0-dev libpng-dev libportmidi-dev libpotrace-dev \
            libpugixml-dev libraw-dev librsvg2-dev libsdl2-dev libsecret-1-dev \
            libsqlite3-dev libtiff-dev libwebp-dev libxml2-dev zlib1g-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBINARY_PACKAGE_BUILD=ON \
            -DBUILD_CURVE_TOOLS=ON \
            -DBUILD_NOISE_TOOLS=ON

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Build .deb
        run: cd build && cpack -G DEB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.label }}
          path: build/*.deb
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: rpm (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --tmpfs /tmp:exec
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'fedora:41', label: 'fedora-41' }
    steps:
      # a container job needs git present before actions/checkout can run
      - name: Bootstrap git
        run: dnf -y install git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf -y install rpm-build dnf-plugins-core cmake ninja-build
          dnf -y builddep packaging/obs/libre-dt-lab.spec

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBINARY_PACKAGE_BUILD=ON \
            -DBUILD_CURVE_TOOLS=ON \
            -DBUILD_NOISE_TOOLS=ON

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Build .rpm
        run: cd build && cpack -G RPM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-${{ matrix.label }}
          path: build/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach packages to release
    needs: [deb, rpm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
